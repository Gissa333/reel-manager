name: Build Reel Manager Setup

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore
      run: dotnet restore

    - name: Build
      run: dotnet build --configuration Release --no-restore

    - name: Publish
      run: dotnet publish --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -o publish

    - name: Install Inno Setup
      run: choco install innosetup -y --no-progress

    - name: Build Installer
      run: |
        & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

    - name: Upload Setup
      uses: actions/upload-artifact@v4
      with:
        name: ReelManager_Setup
        path: installer_output/*.exe

    - name: Upload Portable
      uses: actions/upload-artifact@v4
      with:
        name: ReelManager_Portable
        path: publish/